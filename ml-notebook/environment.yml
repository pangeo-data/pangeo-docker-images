# Note: this environment will be merged with the pangeo-notebook/environment.yml
# by conda-lock. Only put things here that are not already in pangeo-notebook
name: pangeo
channels:
 - conda-forge
 - nodefaults
dependencies:
 - cuda-version>=13.0
 - flax>=0.10.2
 - jax
 - jaxlib>=0.10.2=cuda13*
 - jupyterlab-nvdashboard
 - keras-cv
 - python=3.12 # https://github.com/conda-forge/tensorflow-feedstock/pull/409
 - tensorflow>=2.21.0=cuda13*
